<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail · Work receipts</title>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--ink:#f1f4f8;--muted:#bac3d0;--line:#536073;--accent:#bfff00;--proof:#81ddd0;--attention:#ffcf8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:20px}h1,h2,h3{line-height:1.3}h1{font-size:26px;margin:8px 0}h2{font-size:25px;margin:10px 0}h3{font-size:18px;margin:12px 0}a{color:var(--accent)}a,button{min-height:44px;display:inline-flex;align-items:center}button,input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px}button{cursor:pointer}input{width:100%;min-height:44px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap}label{min-width:0}label span{display:block;font-size:14px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2.1fr);gap:28px}.row{display:block;border-bottom:1px solid var(--line);padding:16px 0;text-decoration:none;color:inherit;overflow-wrap:anywhere}.row[aria-current=true]{border-left:3px solid var(--accent);padding-left:12px}.muted{color:var(--muted)}.metadata,pre{font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}article,section{min-width:0;overflow-wrap:anywhere}section{border-top:1px solid var(--line);padding:10px 0}details{margin:8px 0}summary{cursor:pointer;padding:10px 0;min-height:44px}blockquote{margin:8px 0;padding:10px;border-left:2px solid var(--line);white-space:pre-wrap}p{margin:8px 0}.assessment{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:14px 0 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}.assessment .label{display:block;font-size:14px;color:var(--muted)}.assessment strong{display:block;font-size:18px}.proof{color:var(--proof)}.attention{color:var(--attention)}.pair{display:block;font-size:14px;color:var(--muted);margin-top:4px}.check-row{display:flex;gap:12px;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:8px 0}.check-row a{flex-shrink:0}.reading-note{max-width:65ch}#message{min-height:24px;color:var(--muted);font-size:14px}#search-panel>summary{color:var(--accent)}@media(min-width:701px){#search-panel>summary{font-size:14px}}@media(max-width:700px){body[data-selected=true] #list{display:none}body[data-selected=false] #detail{display:none}.layout{display:block}header,main{padding:12px 16px}header h1{font-size:20px}body[data-selected=true] #intro,body[data-selected=true] header h1{display:none}form{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.controls select{width:100%}.row{padding:12px 0}.assessment{grid-template-columns:1fr;gap:8px;padding:10px 0}.assessment>div{display:grid;grid-template-columns:115px minmax(0,1fr)}.assessment .label{align-self:center}.assessment strong{font-size:16px}.assessment .note{grid-column:2;font-size:14px}h2{font-size:23px}#message{margin:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><a id="legacy" href="/">Legacy thread history</a><h1>Work receipts</h1><p id="intro" class="muted">Find the result, then inspect the proof.</p>
<details id="search-panel" open><summary>Search work</summary><form id="search"><label><span>Words, PR number, or filename</span><input id="query" type="search" placeholder="e.g. retry fix"></label><div class="controls"><label><span>Result</span><select id="result"><option value="">All results</option><option value="blocked">Blocked</option><option value="failed">Failed</option><option value="partially_succeeded">Partial</option><option value="succeeded">Succeeded</option><option value="unknown">Unknown</option></select></label><button>Search</button><button type="button" id="clear">Clear</button></div></form><details><summary>Optional query syntax</summary><p class="muted">Use exact filters such as <code>outcome:blocked</code>, <code>unmet:tests</code>, <code>repo:atlas</code> or <code>pr:55</code>. Search matches recorded words and filters.</p></details></details><p id="message" role="status" aria-live="polite"></p></header>
<main class="layout"><nav id="list" aria-label="Work receipts"></nav><article id="detail" aria-label="Selected receipt"><p>Select a receipt to inspect its evidence.</p></article></main>
<script type="module">
const token=new URL(location.href).searchParams.get('k')||'';
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;};
const list=document.querySelector('#list'),detail=document.querySelector('#detail'),message=document.querySelector('#message'),query=document.querySelector('#query'),result=document.querySelector('#result'),searchPanel=document.querySelector('#search-panel');
const date=(value)=>typeof value!=='string'||!Number.isFinite(Date.parse(value))||value.startsWith('1970-01-01')?'Time unknown':new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).format(new Date(value))+' UTC';
const words=(value)=>String(value||'unknown').replaceAll('_',' ');
document.querySelector('#legacy').href='/?k='+encodeURIComponent(token);
const local=(path,params={})=>{const u=new URL(path,location.origin);u.searchParams.set('k',token);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);return u;};
async function read(path,params,signal){const r=await fetch(local(path,params),{signal});if(!r.ok)throw new Error(r.status===409?'This short ID matches several records. Use a full ID.':'Read failed. Last loaded data is retained.');return r.json();}
let controller,lastSelection;
function section(title){const s=el('section');s.append(el('h3',title));detail.append(s);return s;}
function disclosure(parent,title,body){const d=el('details');d.append(el('summary',title));if(body)d.append(body);parent.append(d);return d;}
function openEvidence(id){const target=document.getElementById('evidence-'+id);if(!target)return;for(let p=target;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;target.querySelector('summary').focus();target.scrollIntoView({block:'center'});}
function evidenceLink(id){const a=el('a','Inspect proof');a.href='#evidence-'+id;a.onclick=(e)=>{e.preventDefault();openEvidence(id);};return a;}
function uniqueChecks(checks){const seen=new Set();return checks.filter((c)=>{const k=JSON.stringify([c.evidence_ids?.length?c.evidence_ids:c.name,c.status]);if(seen.has(k))return false;seen.add(k);return true;});}
function render(r,focus=false){
 detail.replaceChildren();const back=el('a','Back to receipts'),backUrl=new URL(location.href);backUrl.searchParams.delete('id');back.href=backUrl.href;back.onclick=(e)=>{e.preventDefault();history.pushState({},'',back.href);load();};detail.append(back);
 const title=el('h2',r.summary);title.tabIndex=-1;detail.append(title,el('p',`${r.repo||'Repository unresolved'} · ${r.client} · ${date(r.at)}`,'muted'));
 const checks=uniqueChecks(r.verification_detail.checks||[]),passed=checks.filter((c)=>c.status==='passed').length,summary=el('div',null,'assessment');
 const summaryRow=(label,value,note,cls)=>{const n=el('div');n.append(el('span',label,'label'),el('strong',value,cls),el('span',note,'note muted'));summary.append(n);};
 summaryRow('Current assessment',words(r.outcome),r.outcome_basis==='local_human_correction'?'Local correction':r.outcome_basis==='inferred_conflict'?'Conflicting evidence needs review':'Inferred from recorded work');
 summaryRow('Recorded checks',checks.length?`${passed} passed of ${checks.length}`:'No check recorded','Supports the named checks only',passed?'proof':null);
 summaryRow('Acceptance','Unavailable here','Workspace judgment is not loaded');detail.append(summary);
 if(r.inspection.conflicts.length)detail.append(el('p','The result and criteria conflict. Keep both on record until reviewed.','attention'));
 const objective=disclosure(detail,'Request and objective',el('p',r.intent.objective||'Full objective not included in this record.'));objective.id='objective';
 const checkSection=section('Recorded checks');if(!checks.length)checkSection.append(el('p','No checks included in this record.','muted'));
 for(const c of checks){const row=el('div',null,'check-row');row.append(el('span',`${c.name} · ${words(c.status)}`,c.status==='passed'?'proof':null));if(c.evidence_ids?.[0])row.append(evidenceLink(c.evidence_ids[0]));checkSection.append(row);}
 const criteria=section('Criteria');if(!r.criteria.length)criteria.append(el('p','No criteria extracted for this work.'));
 for(const c of r.criteria){const d=el('details'),original=r.inspection.original.criteria.find((x)=>x.id===c.id),review=(r.review?.criteria||[]).find((x)=>x.criterion_id===c.id);d.id='criterion-'+c.id;
  const heading=el('summary',`${c.status.toUpperCase()} · ${c.text}`);if(c.by)heading.append(el('span',`Original ${words(original?.status)} → current ${words(c.status)} · local correction`,'pair'));d.append(heading);
  if(c.by)d.append(el('p','A local correction leaves the earlier check on record.','reading-note muted'));
  const sources=disclosure(d,'Source and proof');for(const ref of review?.source_refs||[])sources.append(el('p','Criterion source quotation:','muted'),el('blockquote',ref.quote||'Quotation not included'));
  for(const lens of ['judged','measured','observed','outcome']){const v=review?.lenses?.[lens];sources.append(el('p',`${lens[0].toUpperCase()+lens.slice(1)} proof: ${v?.status||'unavailable'}${v?.note?' · '+v.note:''}`,'muted'));}
  if(!c.evidence_ids.length)d.append(el('p','No supporting evidence attached.','muted'));for(const id of c.evidence_ids)d.append(evidenceLink(id));criteria.append(d);
 }
 const artifacts=section('Artifacts');if(!r.artifacts.length)artifacts.append(el('p','No artifacts included.','muted'));for(const a of r.artifacts){artifacts.append(el('p',`${a.name} · delivery not established here`));disclosure(artifacts,'Artifact details',el('p',`Producer reports ${a.role}; ${a.ref?.id||'identity unavailable'}`,'metadata'));}
 const evidence=section('Proof');const index=disclosure(evidence,`Evidence index (${r.evidence.length})`);for(const e of r.evidence){const d=disclosure(index,`${e.kind==='check_output'?'Check output':e.kind==='request'?'Request':words(e.kind)} · ${e.summary}`);d.id='evidence-'+e.id;d.append(el('p',date(e.observed_at),'muted'),el('blockquote',e.excerpt||'Excerpt not included'),el('p','Stored excerpt only. Original source is not loaded; this event does not establish deployment or acceptance.','muted'),el('p',e.ref?`${e.ref.system} / ${e.ref.type} / ${e.ref.id}`:'Source locator not included','metadata'));}
 const historySection=section('Work history');const historyIndex=disclosure(historySection,`Actions and changes of course (${r.actions.length})`);for(const a of r.actions)historyIndex.append(el('p',`${words(a.status)} · ${a.summary} · ${date(a.started_at)}`));for(const c of r.changes_of_course)historyIndex.append(el('p',`${words(c.trigger)} · ${c.evidence}`));historyIndex.append(el('p','Decision records are not available for this work.','muted'));
 if(r.links.length){const related=section('Related work');for(const l of r.links){const a=el('a',`${words(l.relationship)} · ${l.other_summary||l.other} (derived link)`),u=new URL(location.href);u.searchParams.set('id',l.other);a.href=u.href;a.onclick=(e)=>{e.preventDefault();globalThis.history.pushState({},'',a.href);load();};related.append(a);const why=disclosure(related,'Why linked',el('p',Array.isArray(l.evidence)&&l.evidence.length?l.evidence.join(' · '):'Linking evidence is unavailable.'));if(Number.isFinite(l.confidence))why.append(el('p',`Heuristic score: ${l.confidence}. This derived link does not establish acceptance.`,'muted'));}}
 const coverage=section('Coverage');coverage.append(el('p',r.coverage.status==='complete'?'All provided steps are represented. Original history coverage is unknown.':`${words(r.coverage.status)} for ${r.coverage.scope}; original history coverage is unknown.`));for(const[name,s]of Object.entries(r.coverage.sections||{}))if(s.truncated)coverage.append(el('p',`${words(name)}: ${s.returned} of ${s.total??'unknown'} shown; omitted by receipt limit.`));
 const counts=disclosure(coverage,'Coverage counts and sync');for(const[name,s]of Object.entries(r.coverage.sections||{}))counts.append(el('p',`${words(name)}: ${s.returned} of ${s.total??'unknown'}`));counts.append(el('p','Shared sync acknowledgment is unavailable in this read.','muted'));
 disclosure(coverage,'Exact timestamps, IDs and original record',el('pre',JSON.stringify({id:r.id,receipt_started_at:r.at,review_revision:r.review_revision,acceptance:r.acceptance,original:r.inspection.original,corrections:r.inspection.corrections,provenance:r.provenance},null,2)));
 if(focus)title.focus();
}
async function load(){controller?.abort();controller=new AbortController();const signal=controller.signal,state=new URL(location.href),selected=state.searchParams.get('id'),changed=lastSelection!==undefined&&lastSelection!==selected,previous=lastSelection;lastSelection=selected;document.body.dataset.selected=String(!!selected);
 if(changed||previous===undefined)searchPanel.open=innerWidth>700||!selected;if(!selected)detail.replaceChildren(el('p','Select a receipt to inspect its evidence.'));query.value=state.searchParams.get('q')||'';result.value=state.searchParams.get('outcome')||'';message.textContent='Loading local receipts…';
 try{const q=[query.value,result.value?'outcome:'+result.value:''].filter(Boolean).join(' '),data=await read('/api/v1/receipts',{q,limit:20,offset:state.searchParams.get('offset')||0},signal);if(signal.aborted)return;list.replaceChildren();message.textContent=`${data.coverage.returned} of ${data.coverage.total} matches · updated ${date(data.as_of)}`;
  if(!data.results.length)list.append(el('p',query.value||result.value?'No matches. Clear the search to see recent work.':'No work recorded yet. Use trail scan locally to record supported history.'));
  for(const r of data.results){const a=el('a',null,'row'),u=new URL(location.href);u.searchParams.set('id',r.id);a.href=u.href;a.dataset.id=r.id;a.setAttribute('aria-current',String(selected===r.id));a.append(el('strong',r.summary),el('div',`${words(r.outcome)} · ${r.criteria.unknown?r.criteria.unknown+' criteria without evidence':'Inspect the recorded proof'}`,'muted'),el('div',`${r.repo||'Repository unresolved'} · ${date(r.at)}`,'muted'));a.onclick=(e)=>{e.preventDefault();history.pushState({},'',a.href);load();};list.append(a);}
  if(data.coverage.next_offset!=null){const b=el('button','Next receipts');b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('offset',data.coverage.next_offset);history.pushState({},'',u);load();};list.append(b);}
  if(selected){const r=await read('/api/v1/receipt',{id:selected},signal);if(!signal.aborted)render(r,changed);}else if(changed){[...list.querySelectorAll('a.row')].find((a)=>a.dataset.id===previous)?.focus();}
 }catch(e){if(e.name!=='AbortError')message.textContent=e.message+' Use Search to retry.';}}
document.querySelector('#search').onsubmit=(e)=>{e.preventDefault();const u=new URL(location.href);u.searchParams.set('q',query.value);result.value?u.searchParams.set('outcome',result.value):u.searchParams.delete('outcome');u.searchParams.delete('offset');history.pushState({},'',u);load();};
document.querySelector('#clear').onclick=()=>{const u=new URL(location.href);for(const key of ['q','outcome','offset'])u.searchParams.delete(key);history.pushState({},'',u);load();};addEventListener('popstate',load);load();
</script></html>
