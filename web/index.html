<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>orgx trail</title>
<style>
:root{--bg:#0B0C0E;--panel:#121417;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--ink:#ECEDEE;--mid:#A7ACB3;--dim:#6C727A;--lime:#BFFF00;--teal:#2DD4BF;--iris:#8B8CFF;--coral:#FF7A66;--amber:#F5B700;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto auto 1fr auto;min-height:100%}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:8px;align-items:center;font-weight:600}.brand i{width:10px;height:10px;background:var(--lime);border-radius:2px}
.meta{color:var(--mid)}
input[type=search]{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:6px 9px;min-width:200px;font:inherit}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{all:unset;cursor:pointer;padding:4px 8px;border-radius:5px;color:var(--mid);border:1px solid var(--line)}.chip[aria-pressed=true]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.chip:focus-visible,input:focus-visible,.wall:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.kpis{display:flex;flex-wrap:wrap;gap:6px 28px;padding:10px 16px;border-bottom:1px solid var(--line)}
.kpi b{font:500 18px/1.2 ui-monospace,Menlo,monospace;margin-right:6px}.kpi span{color:var(--mid)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#stage{position:relative;min-height:420px;border-right:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:#000;border:1px solid var(--line2);padding:7px 9px;border-radius:6px;max-width:320px;opacity:0;font-size:12px}
aside{overflow:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:500}
.wall{border-top:1px solid var(--line);padding:9px 0;cursor:pointer}.wall .n{color:var(--coral);font:500 13px ui-monospace,Menlo,monospace;min-width:44px;display:inline-block}
.wall .more{display:none;color:var(--mid);font-size:12px;margin-top:6px}.wall.open .more{display:block}
.fix{color:var(--ink);border-left:2px solid var(--lime);padding-left:8px;margin-top:6px}
.adopted{color:var(--teal)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.act{all:unset;cursor:pointer;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line2);color:var(--ink)}.act:hover{border-color:var(--lime)}.act:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.braid{font:12px/1.2 ui-monospace,Menlo,monospace;word-break:break-all;letter-spacing:1px}
.p{color:var(--dim)}.c{color:var(--lime)}.h{color:var(--teal)}.s{color:var(--ink)}.X,.D{color:var(--coral)}.d{color:var(--iris)}
.status{font:500 11px ui-monospace,Menlo,monospace;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.back{color:var(--coral)}.note{color:var(--mid);border-left:2px solid var(--line2);padding-left:8px}
footer{display:flex;flex-wrap:wrap;gap:6px 26px;padding:10px 16px;border-top:1px solid var(--line);color:var(--mid)}
footer svg{vertical-align:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px}.legend i{display:inline-block;width:10px;height:6px;border-radius:1px;margin-right:5px;vertical-align:middle}
button.link{all:unset;cursor:pointer;color:var(--lime)}
@media (max-width:900px){main{grid-template-columns:1fr}#stage{min-height:360px;border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header>
  <div class="brand"><i></i>orgx trail</div><div class="meta mono" id="meta">loading…</div>
  <input type="search" id="q" placeholder="Search threads" aria-label="Search threads">
  <div class="chips" id="fo" role="group" aria-label="Origin"></div>
  <div class="chips" id="fs" role="group" aria-label="Status"></div>
</header>
<div class="kpis" id="kpis"></div>
<main>
  <div id="stage"><canvas id="cv" aria-label="Every thread of agent work over time, one row per project"></canvas><div id="tip"></div></div>
  <aside id="side"></aside>
</main>
<footer><div class="legend" id="legend"></div><div id="spark"></div><div class="meta">scroll to zoom · drag to pan · double-click to reset · click a thread</div></footer>
<script>
const K = new URLSearchParams(location.search).get('k');
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = { outcome: '--teal', abandoned: '--coral', open: '--lime', 'outcome?': '--mid', parked: '--amber' };
const ORIG = { found: '--iris', wall: '--coral', recovery: '--amber' };
let D, T = [], lanes = [], view = { t0: 0, t1: 1 }, full, sel = null, F = { origin: 'all', status: 'all', q: '' };
const fmt = (n) => Math.round(n).toLocaleString('en-US'); const pct = (x) => Math.round(x * 100) + '%';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = (ms) => new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

fetch('data.json?k=' + K).then((r) => r.json()).then((d) => { D = d; init(); });

function init() {
  const tot = D.tot; const first = Math.min(...D.threads.map((t) => t[4]).filter(Boolean)); const last = Math.max(...D.threads.map((t) => t[5]));
  document.getElementById('meta').textContent = `${fmt(tot.sessions)} sessions · ${fmt(tot.threads)} threads · ${day(first)} → ${day(last)}`;
  const k = (v, l, c) => `<div class="kpi"><b style="color:var(${c})">${v}</b><span>${l}</span></div>`;
  document.getElementById('kpis').innerHTML = k(pct(tot.outcome / tot.threads), 'reached an outcome', '--teal') + k(pct(tot.abandoned / tot.threads), 'dropped', '--coral') + k(pct(tot.verified / Math.max(tot.changed, 1)), 'checked after changing', '--lime') + k(fmt(tot.discovery), 'found along the way', '--iris') + k(fmt(tot.rediscoveryCalls), 'calls spent re-hitting known walls', '--coral');
  const top = Object.entries(D.projects).sort((a, b) => b[1] - a[1]); const keep = new Set(top.slice(0, 16).map((x) => x[0]));
  lanes = [...top.slice(0, 16).map((x) => x[0]), 'other'];
  T = D.threads.filter((t) => t[4]).map((t) => ({ sid: t[0], id: t[1], codex: t[2], project: t[3], a: t[4], b: Math.max(t[5], t[4] + 60e3), status: t[6], origin: t[7], title: t[8], moves: t[9], backs: t[10], p: t[11], lane: keep.has(t[3]) ? lanes.indexOf(t[3]) : lanes.length - 1 }));
  // pack each lane into sub-rows so threads never overlap
  const rows = lanes.map(() => []);
  for (const t of T.sort((x, y) => x.a - y.a)) { const r = rows[t.lane]; let k = r.findIndex((end) => end < t.a); if (k < 0) { k = r.length; r.push(0); } r[k] = t.b; t.sub = k; }
  lanes.depth = rows.map((r) => Math.min(Math.max(r.length, 1), 6));
  full = { t0: first - 864e5, t1: last + 864e5 }; view = { ...full };
  chips('fo', ['all', 'found', 'recovery', 'wall', 'ask', 'schedule'], 'origin'); chips('fs', ['all', 'outcome', 'abandoned', 'open'], 'status');
  document.getElementById('legend').innerHTML = [['reached outcome', '--teal'], ['dropped', '--coral'], ['still open', '--lime'], ['unclear', '--mid'], ['found along the way', '--iris'], ['recovered from failures', '--amber'], ['permission wall', '--coral']].map(([n, c]) => `<span><i style="background:var(${c})"></i>${n}</span>`).join('');
  sparkline(); walls(); draw();
}
function chips(id, vals, key) {
  const el = document.getElementById(id);
  el.innerHTML = vals.map((v) => `<button class="chip" aria-pressed="${v === F[key]}" data-v="${v}">${v === 'found' ? 'found along the way' : v === 'abandoned' ? 'dropped' : v}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; F[key] = b.dataset.v; el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); draw(); };
}
document.getElementById('q').oninput = (e) => { F.q = e.target.value.toLowerCase(); draw(); };
const visible = (t) => (F.origin === 'all' || t.origin === F.origin) && (F.status === 'all' || t.status === F.status) && (!F.q || (t.title + ' ' + t.project).toLowerCase().includes(F.q));

const cv = document.getElementById('cv'); const ctx = cv.getContext('2d'); const LW = 132; let geo = null;
function draw() {
  const r = cv.getBoundingClientRect(); const dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height; ctx.clearRect(0, 0, W, H);
  const total = lanes.depth.reduce((a, b) => a + b, 0); const unit = Math.max(4, Math.min(12, (H - 40) / total));
  let y = 18; const laneY = lanes.map((_, i) => { const v = y; y += lanes.depth[i] * unit + 4; return v; });
  const X = (ms) => LW + ((ms - view.t0) / (view.t1 - view.t0)) * (W - LW - 10);
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.textBaseline = 'middle';
  // time ticks
  const span = view.t1 - view.t0; const stepD = span > 90 * 864e5 ? 14 : span > 30 * 864e5 ? 7 : span > 7 * 864e5 ? 1 : 0.25;
  ctx.strokeStyle = css('--line'); ctx.fillStyle = css('--dim');
  for (let t = Math.ceil(view.t0 / (stepD * 864e5)) * stepD * 864e5; t < view.t1; t += stepD * 864e5) { const x = X(t); ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x, H - 16); ctx.stroke(); ctx.fillText(stepD < 1 ? new Date(t).toLocaleTimeString('en-US', { hour: 'numeric' }) : day(t), x + 3, H - 8); }
  lanes.forEach((name, i) => { ctx.fillStyle = css('--mid'); ctx.fillText(name.slice(0, 18), 8, laneY[i] + (lanes.depth[i] * unit) / 2); ctx.strokeStyle = css('--line'); ctx.beginPath(); ctx.moveTo(LW, laneY[i] - 2); ctx.lineTo(W - 10, laneY[i] - 2); ctx.stroke(); });
  geo = { X, laneY, unit, hits: [] };
  const any = F.origin !== 'all' || F.status !== 'all' || F.q;
  for (const t of T) {
    if (t.sub >= lanes.depth[t.lane]) continue;
    const x0 = X(t.a), x1 = Math.max(X(t.b), x0 + 2); if (x1 < LW || x0 > W) continue;
    const yy = laneY[t.lane] + t.sub * unit; const on = visible(t);
    ctx.globalAlpha = on ? 1 : any ? 0.07 : 1;
    ctx.fillStyle = css(ORIG[t.origin] || COL[t.status] || '--mid');
    ctx.fillRect(Math.max(x0, LW), yy, Math.min(x1, W) - Math.max(x0, LW), unit - 2);
    if (t.status === 'abandoned' && ORIG[t.origin]) { ctx.strokeStyle = css('--coral'); ctx.strokeRect(Math.max(x0, LW) + .5, yy + .5, Math.min(x1, W) - Math.max(x0, LW) - 1, unit - 3); }
    if (sel && sel.sid === t.sid && sel.id === t.id) { ctx.strokeStyle = css('--ink'); ctx.lineWidth = 2; ctx.strokeRect(x0 - 1, yy - 1, x1 - x0 + 2, unit); ctx.lineWidth = 1; }
    if (on) geo.hits.push([x0, x1, yy, yy + unit - 2, t]);
  }
  ctx.globalAlpha = 1;
}
function hit(ev) { const r = cv.getBoundingClientRect(); const x = ev.clientX - r.left, y = ev.clientY - r.top; for (let i = geo.hits.length - 1; i >= 0; i--) { const h = geo.hits[i]; if (x >= h[0] - 1 && x <= h[1] + 1 && y >= h[2] && y <= h[3]) return h[4]; } return null; }
const tip = document.getElementById('tip');
cv.addEventListener('mousemove', (ev) => {
  if (drag) { const r = cv.getBoundingClientRect(); const dt = ((ev.clientX - drag.x) / (r.width - LW - 10)) * (drag.v.t1 - drag.v.t0); view = { t0: drag.v.t0 - dt, t1: drag.v.t1 - dt }; draw(); return; }
  const t = hit(ev); if (!t) { tip.style.opacity = 0; return; }
  const r = cv.getBoundingClientRect();
  tip.innerHTML = `<b>${esc(t.title)}</b><br><span class="meta">${esc(t.project)} · ${t.codex ? 'codex' : 'claude'} · ${day(t.a)} · ${t.status === 'abandoned' ? 'dropped' : t.status}${t.origin === 'found' ? ' · found along the way' : t.origin === 'wall' ? ' · permission wall' : t.origin === 'recovery' ? ' · recovery from failures' : ''}</span><br><span class="braid">${braidHTML(t.moves.slice(0, 60))}</span>`;
  tip.style.opacity = 1; tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 330) + 'px'; tip.style.top = ev.clientY - r.top + 14 + 'px';
});
cv.addEventListener('mouseleave', () => (tip.style.opacity = 0));
let drag = null;
cv.addEventListener('mousedown', (ev) => { drag = { x: ev.clientX, v: { ...view }, moved: false }; });
addEventListener('mouseup', (ev) => { if (drag && Math.abs(ev.clientX - drag.x) < 3) { const t = hit(ev); if (t) open(t); } drag = null; });
cv.addEventListener('wheel', (ev) => { ev.preventDefault(); const r = cv.getBoundingClientRect(); const f = (ev.clientX - r.left - LW) / (r.width - LW - 10); const at = view.t0 + f * (view.t1 - view.t0); const z = Math.exp(ev.deltaY * 0.0015); const span = Math.max(36e5, Math.min(full.t1 - full.t0, (view.t1 - view.t0) * z)); view = { t0: at - f * span, t1: at + (1 - f) * span }; draw(); }, { passive: false });
cv.addEventListener('dblclick', () => { view = { ...full }; draw(); });
addEventListener('resize', draw);
const braidHTML = (m) => [...m].map((c) => `<span class="${c}">${{ p: '·', r: '∙', c: '━', h: '✓', s: '▲', d: '◆', X: '✗', D: '⊘' }[c] || '·'}</span>`).join('');

async function open(t) {
  sel = t; draw();
  const d = await fetch(`thread?k=${K}&s=${encodeURIComponent(t.sid)}&t=${encodeURIComponent(t.id)}`).then((r) => r.json());
  const st = { outcome: ['reached outcome', '--teal'], abandoned: ['dropped', '--coral'], open: ['open', '--lime'], 'outcome?': ['unclear', '--mid'] }[d.status] || [d.status, '--mid'];
  document.getElementById('side').innerHTML = `<button class="link" id="bk">← all walls</button>
    <div><h2>${d.origin === 'surprise' ? ({ wall: 'permission wall', recovery: 'recovery from repeated failures' }[d.kind] || 'found along the way') : esc(d.origin)} · ${esc(d.project)} · ${d.client}</h2><div style="font-size:16px;margin-top:4px">${esc(d.title)}</div></div>
    <div><span class="status" style="color:var(${st[1]})">${st[0]}</span> ${d.p_abandon != null ? `<span class="meta">model: ${pct(d.p_abandon)} likely dropped · rules said ${esc(d.status_rule)}</span>` : ''}</div>
    <div class="braid">${braidHTML(d.moves)}</div>
    ${d.claim?.length ? `<div><h2>claims</h2>${d.claim.map(esc).join(' · ')}</div>` : ''}
    ${d.ask ? `<div><h2>asked</h2><div class="note">${esc(d.ask)}</div></div>` : ''}
    ${d.backs?.length ? `<div><h2>backtracks</h2>${d.backs.map((b) => `<div class="back">⟲ ${esc(b.why)} <span class="meta">→ ${esc(b.what)}</span></div>`).join('')}</div>` : ''}
    ${d.notes?.length ? `<div><h2>the agent said</h2>${d.notes.map((n) => `<div class="note">“${esc(n)}”</div>`).join('')}</div>` : ''}
    <div><h2>same session</h2>${d.sessionThreads.map(([id, ti, s, o]) => `<div class="meta">${id === d.id ? '→ ' : ''}${esc(ti)} · ${s}</div>`).join('')}</div>`;
  document.getElementById('bk').onclick = () => { sel = null; walls(); draw(); };
}
function walls() {
  const wk = D.weeks.slice(-16).map((w) => w.wk);
  document.getElementById('side').innerHTML = `<h2>Walls your agents keep hitting</h2>` + D.walls.map((w, i) => {
    const mx = Math.max(...wk.map((k) => w.weeks[k] || 0), 1);
    const sp = `<svg width="96" height="16" viewBox="0 0 96 16" aria-hidden="true">${wk.map((k, j) => `<rect x="${j * 6}" y="${16 - ((w.weeks[k] || 0) / mx) * 15}" width="4" height="${((w.weeks[k] || 0) / mx) * 15}" fill="var(--coral)"/>`).join('')}</svg>`;
    return `<div class="wall" tabindex="0" data-i="${i}"><span class="n">${fmt(w.sessions)}</span> ${esc(w.name)} ${w.adopted ? '<span class="adopted">● adopted</span>' : ''}
      <div class="more">${sp}<div>${fmt(w.calls)} calls · first ${day(Date.parse(w.first))} · last ${day(Date.parse(w.last))} · ${Object.entries(w.clients).map(([k, v]) => k + ' ' + v).join(' · ')}</div>
      ${w.samples.map((s) => `<div class="note">${esc(s)}</div>`).join('')}
      <div class="fix">${esc(w.rule)}</div>
      ${w.adopted ? `<div class="adopted" style="color:var(--${w.effect?.tone === 'amber' ? 'amber' : w.effect?.tone === 'coral' ? 'coral' : 'teal'})">adopted · ${esc(w.effect?.text || '')}</div>` : ''}
      <div class="acts"><button class="act" data-copy="${esc(w.action.prompt)}">Copy prompt for your agent</button><button class="act" data-copy="${esc(w.action.rule)}">Copy rule</button><button class="act" data-copy="${esc(w.action.command)}">Copy command</button></div></div></div>`;
  }).join('');
  document.querySelectorAll('.act').forEach((b) => { b.onclick = async (e) => { e.stopPropagation(); const t = b.dataset.copy; try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement('textarea'); ta.value = t; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); } const o = b.textContent; b.textContent = 'Copied'; setTimeout(() => (b.textContent = o), 1200); }; });
  document.querySelectorAll('.wall').forEach((el) => { const tg = () => el.classList.toggle('open'); el.onclick = tg; el.onkeydown = (e) => { if (e.key === 'Enter') tg(); }; });
}
function sparkline() {
  const wk = D.weeks.slice(-16); const s = (xs, c, label) => { const mx = Math.max(...xs, 1e-9); return `<span>${label} <svg width="${xs.length * 5}" height="14">${xs.map((x, i) => `<rect x="${i * 5}" y="${14 - (x / mx) * 13}" width="3" height="${(x / mx) * 13}" fill="var(${c})"/>`).join('')}</svg></span>`; };
  document.getElementById('spark').innerHTML = [s(wk.map((w) => w.threads), '--ink', 'threads'), s(wk.map((w) => w.outcome / Math.max(w.threads, 1)), '--teal', 'outcome rate'), s(wk.map((w) => w.wallCalls), '--coral', 'wall calls')].join('&nbsp;&nbsp;&nbsp;');
}
</script>
</body></html>
